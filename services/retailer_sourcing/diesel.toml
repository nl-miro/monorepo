# Diesel CLI settings. Regenerate the schemas with `diesel print-schema` against
# a database migrated with `diesel migration run`.

[print_schema.sitemap_discovery]
file = "src/steps/sitemap/schema.rs"
filter = { only_tables = [
    "sitemaps_raw",
    "sitemaps_processed",
    "sitemaps_consolidated",
] }

[print_schema.download_offer_page]
file = "src/steps/html/download_offer_page/schema.rs"
filter = { only_tables = ["offer_details_raw"] }

[print_schema.extract_offer_page]
file = "src/steps/html/extract_offer_page/schema.rs"
filter = { only_tables = ["offer_details_extracted"] }

[print_schema.normalize_offer]
file = "src/steps/html/normalize_offer/schema.rs"
filter = { only_tables = ["offer_details_normalized"] }

[print_schema.structuralize_offer]
file = "src/steps/html/structuralize_offer/schema.rs"
filter = { only_tables = ["offer_details_structuralized"] }

[migrations_directory]
dir = "migrations"
