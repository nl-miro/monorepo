[workspace]
resolver = "2"
members = [
    "back_office",
    "customers",
    "development",
]

[workspace.dependencies]
poem = "3.1.12"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../../../space/bodul_hq/lib_shared" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }

[patch."sparse+https://bodul-hq.github.io/crates/"]
retailer_sauce = { path = "../../../space/bodul_hq/lib_retailer_sauce" }
shared = { path = "../../../space/bodul_hq/lib_shared" }
