[workspace]
resolver = "2"
members = [
    "retailer_data_extractor",
    "retailers_anker",
    "retailers_minisforum",
    "retailers_ugreen",
    "retailers_wip",
    "object_storage_client",
    "testimony",
    "testimony_infra",
    "inbox_client",
]

[workspace.dependencies]
graphql_client = "0.16.0"
scraper = { version = "0.27.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
everyday = { version = "0.1.0", registry = "bodul" }
html-extractor = { version = "0.3.3-dev.2", registry = "null-labs-hq" }
money = { version = "0.1.1", registry = "bodul" }
retailer_sauce = { version = "0.1.1", registry = "bodul" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shared = { version = "0.1.1", registry = "bodul" }
thiserror = "2.0.20"
url = "2.5.8"
