[workspace]
resolver = "2"
members = [
    "retailer_data_extractor",
    "retailers_wip",
    "object_storage_client",
    "testimony",
    "testimony_infra",
    "inbox_client",
]

[workspace.dependencies]
retailers_wip = { path = "retailers_wip" }
graphql_client = "0.16.0"
scraper = { version = "0.27.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
everyday = { path = "../../../space/bodul_hq/lib_everyday" }
html-extractor = { version = "0.3.3-dev.2", registry = "null-labs-hq" }
money = { path = "../../../space/bodul_hq/lib_money" }
retailer_sauce = { path = "../../../space/bodul_hq/lib_retailer_sauce" }
retailers_anker = { path = "../../../space/bodul_hq/lib_retailers_anker" }
retailers_minisforum = { path = "../../../space/bodul_hq/lib_retailers_minisforum" }
retailers_ugreen = { path = "../../../space/bodul_hq/lib_retailers_ugreen" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shared = { path = "../../../space/bodul_hq/lib_shared" }
thiserror = "2.0.20"
url = "2.5.8"

[patch.bodul]
everyday = { path = "../../../space/bodul_hq/lib_everyday" }
money = { path = "../../../space/bodul_hq/lib_money" }
retailer_sauce = { path = "../../../space/bodul_hq/lib_retailer_sauce" }
shared = { path = "../../../space/bodul_hq/lib_shared" }
