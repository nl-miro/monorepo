        cursor
        node {
          __typename
          availableForSale
          barcode
          compareAtPrice {
            __typename
            amount
            currencyCode
          }
          components(first: $pageSize5) {
            pageInfo {
              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                productVariant {
                  __typename
                  id
                  title
                }
