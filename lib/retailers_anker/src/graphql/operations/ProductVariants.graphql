              }
            }
          }
          currentlyNotInStock
          groupedBy(first: $pageSize5) {
            pageInfo {
              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                id
                title
              }
            }
          }
          id
          image {
            __typename
            altText
            height
            id
            thumbhash
            url
            width
          }
          price {
            __typename
            amount
            currencyCode
          }
