              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                minimumQuantity
                price {
                  __typename
                  amount
                  currencyCode
                }
              }
            }
          }
          quantityRule {
            __typename
            increment
            maximum
            minimum
          }
          requiresComponents
          requiresShipping
          selectedOptions {
            __typename
            name
            value
          }
          sku
          storeAvailability(first: $pageSize5) {
            pageInfo {
              hasNextPage
