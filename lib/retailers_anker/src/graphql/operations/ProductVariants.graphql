query ProductVariants($pageSize5: Int!, $pageSize10: Int!, $country: CountryCode, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { product(id: $id) { id variants(first: $pageSize10, after: $after) {
